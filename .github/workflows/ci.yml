name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pytest httpx pyyaml fakeredis
      - name: Run tests (skip live-deploy checks and self-referential badge check)
        run: pytest --ignore=tests/test_cp5.py -k "not test_badge_bao_passing" -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t day12-agent:ci .

  deploy:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Render auto-deploys on push to main
        run: echo "Render watches ${{ secrets.RENDER_SERVICE_URL }} and redeploys automatically after this push."
